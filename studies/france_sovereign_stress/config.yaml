# france_sovereign_stress — v6 study config
study_id: france_sovereign_stress
description: >
  OAT–Bund 10Y spread stress trade. Simulate right-world paths to 240/300/340/400 bp and wrong-world paths to
  1 Jul 2027; score futures (FOAT/FGBL spread, outright legs, CAC 40 / French non-bank shorts) and Eurex options.

horizon:
  end: "2027-07-01"
  calendar: business_days

view:
  levels_bp: [240, 300, 340, 400]
  optimise_bp: 300
  scenario_odds:            # subjective, from the 5 Oct 2026 proposal; reported, not used for EV
    relief: 0.15            # ~85 bp
    grind: 0.50             # 140–170 bp
    stress: 0.30            # 200–300 bp
    contested: 0.05         # > 300 bp

budget_eur: 10000

# Overnight initial margin per contract (IBKR Europe / Eurex Prisma). Additive
# ceiling for short FOAT + long FGBL; live portfolio credit may be a bit lower.
# Refresh with TWS Preview on each leg; update asof when you do.
margin:
  asof: "2026-10-12"
  source: "IBKR Europe TWS order preview (Lynx), overnight initial"
  initial_eur:
    FOAT: 3247   # short OAT Dec26 Δ IM
    FGBL: 2363   # long GBL Dec26 Δ IM
  fgbl_cap: 18
  budget_scenarios_eur: [10000, 15000, 20000]

simulation:
  n_paths: 10000
  seed: 11
  event_bdays: 15
  event_vol_mult: 2.0
  bund_flight_share: [0.10, 0.70]
  noise: {dist: student_t, dof: 4}
  vol_window_bdays: 126

instruments:                # v5 calibration values; v6 re-derives them
  FOAT: {venue: eurex, nominal: 100000, tick: 0.01, tick_eur: 10, eur_per_bp_v5: 87.58}
  FGBL: {venue: eurex, nominal: 100000, tick: 0.01, tick_eur: 10, eur_per_bp_v5: 96.57}
  FCE:  {venue: euronext, eur_per_point: 10}
  MFC:  {venue: euronext, eur_per_point: 1}

costs:
  fee_per_contract_eur: 2.00  # Lynx blotter 12 Oct 2026; was 2.35 = 2.00 + ~0.27 Eurex
  half_tick_per_side: true
  stop_slippage_bp: 1.0
  gap_fill: half_gap        # v5; v6 should make daily-close execution the baseline
  stock_cost_pa: 0.035
  cac_future_carry_pa: 0.01
  # v7 options (Swissquote). Published tariff not confirmed live — conservative assumption.
  option_fee_per_contract_eur: 2.50
  option_fee_note: >
    Assumed €2.50/contract/side for Eurex OOAT/OGBL and equity options at Swissquote.
    Flagged as unconfirmed; show fee sensitivity if tariff differs.

rules:
  spread_cap_foat: 20
  recommended: {stop_bp: 40, add_every_bp: 20, keep: 0.0}

calibration:
  settle_window_days: 20    # futures €/bp regression and carry: last N settlement days

reference:
  v5_dir: input/v5_reference
  stamp: "2026-10-09T1456"

# Active run. null = replay the v5 reference (strict reconcile gates).
# A stamp reads input/snapshots/<stamp>/data, written by run_snapshot.py.
# Override per shell with FSS_SNAPSHOT=<stamp> or FSS_SNAPSHOT=reference.
snapshot:
  stamp: "2026-10-13T1010"
